plugins { id 'com.android.library'; id 'kotlin-android' }
android {
    namespace 'com.tbuonomo.morphbottomnavigation'
    compileSdk 34
    defaultConfig { minSdk 19; targetSdk 34; versionCode 1; versionName '1.0' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = '11' }
}
dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.9.0'
    api 'com.google.android.material:material:1.0.0-alpha3'
    api 'com.tbuonomo:magicshapepath:1.0.0-alpha3'
}
